<!doctype html>
<html lang="en" style="background: white; color: black">
    <meta charset="utf-8" /><title>Frame</title>
    <style>
        body {
            margin: 8px;
        }
        p {
            margin: 0 0 8px;
        }
        button {
            color: #555;
            background: white;
        }
        button:hover {
            color: black;
        }
    </style>
    <p id="frame-text">Frame text</p>
    <button id="frame-action">Frame action</button>
    <open-sample></open-sample>
    <script>
        window.actions = 0;
        for (const type of ['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click']) {
            document.querySelector('button').addEventListener(type, () => window.actions++);
        }
        document.querySelector('open-sample').attachShadow({ mode: 'open' }).innerHTML =
            '<span id="frame-shadow">Shadow frame text</span><svg width="100" height="30"><text y="20">SVG text</text></svg>';
    </script>
</html>
